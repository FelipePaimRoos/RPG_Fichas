include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - windows/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # A documentação pública é desejável, mas não é pré-requisito para
    # compilar nesta fase de fundação.
    public_member_api_docs: false
    # A sintaxe `new Foo()` do Dart 3.13 ainda não é a convenção do ecossistema
    # Flutter; manter o construtor nomeado explícito.
    unnecessary_type_name_in_constructor: false
    # Textos de interface em português (rótulos, avisos e mensagens do app
    # web) não cabem em 80 colunas; quebrá-los no meio prejudica a leitura.
    lines_longer_than_80_chars: false
