# Build: artefatos para Windows, Linux e Android (sem Apple).
# Roda manualmente (workflow_dispatch) e em tags v*; em tags, publica uma release.
name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      app_exists: ${{ steps.check.outputs.app_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          if [ -f app_flutter/pubspec.yaml ]; then
            echo "app_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::app_flutter/pubspec.yaml ainda não existe; builds serão pulados."
          fi

      - name: Verificar se a tag está na main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch origin main
          TAG_COMMIT="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" FETCH_HEAD; then
            echo "::error::Tags de release devem apontar para um commit da main. Faça o merge em main antes de taguear."
            exit 1
          fi

      - name: Dependências do Linux desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        working-directory: app_flutter
        run: flutter pub get

      - name: Build
        working-directory: app_flutter
        run: flutter build linux --release

      - name: Empacotar
        run: tar -czf rpg-fichas-linux-x64.tar.gz -C app_flutter/build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: rpg-fichas-linux-x64
          path: rpg-fichas-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: preflight
    if: needs.preflight.outputs.app_exists == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        working-directory: app_flutter
        run: flutter pub get

      - name: Build
        working-directory: app_flutter
        run: flutter build windows --release

      - name: Empacotar
        shell: pwsh
        run: |
          Compress-Archive `
            -Path app_flutter/build/windows/x64/runner/Release/* `
            -DestinationPath rpg-fichas-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rpg-fichas-windows-x64
          path: rpg-fichas-windows-x64.zip
          if-no-files-found: error

  android:
    name: Android
    needs: preflight
    if: needs.preflight.outputs.app_exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app_flutter/android/**/*.gradle*', 'app_flutter/android/**/gradle-wrapper.properties', 'app_flutter/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dependências
        working-directory: app_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: app_flutter
        run: flutter build apk --release

      - name: Copiar APK
        run: cp app_flutter/build/app/outputs/flutter-apk/app-release.apk rpg-fichas-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rpg-fichas-android
          path: rpg-fichas-android.apk
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rpg-fichas-*
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
