name: app_flutter
description: "Cliente desktop e mobile do RPG Fichas."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.8
  desktop_drop: ^0.8.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.4.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  path_provider: ^2.1.6

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  # JSONs autorais dos catálogos (fonte única, dentro do app) e ícones.
  assets:
    - json/
    - assets/icons/
